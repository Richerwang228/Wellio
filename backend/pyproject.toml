[project]
name = "wellio-backend"
version = "0.1.0"
description = "Wellio FastAPI business backend with PostgreSQL persistence and compatible HTTP contracts"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.10,<3",
  "httpx>=0.27,<1",
  "pillow>=11,<13",
  "python-multipart>=0.0.20,<1",
  "rfc8785>=0.1,<1",
  "psycopg[binary]>=3.2,<4",
  "exa-py==2.14.0",
  "python-dotenv>=1,<2",
  "anyio>=4.9,<5",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wellio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
