services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: wellio
      POSTGRES_USER: wellio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wellio_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - wellio_pg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wellio -d wellio"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  wellio_pg:
